<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">How Self-Improving MCP works</title>
  <desc id="d">Live: an AI agent talks to the proxy, which forwards to your unchanged MCP server, applies the active overlay and records every call. Offline: observe the recorded traffic, improve tool descriptions on dev tasks, judge on sealed tasks, review, and promote; the proxy then hot-reloads the new overlay.</desc>
  <style>:root{--ink:#1f2328;--muted:#59636e;--faint:#818b98;--line:#d1d9e0;--page:#ffffff;--card:#f6f8fa;--body:#ffffff;--glass:#eef3ff;--blue:#2a78d6;--aqua:#1baf7a;--violet:#6250d6;--orange:#eb6834;--amber:#eda100;--red:#e34948;--green:#008300;--blue-soft:#e8f1fc;--aqua-soft:#e6f6ef;--violet-soft:#efedfc;--orange-soft:#fdeee7;--red-soft:#fdecec;--green-soft:#e6f3e6;--amber-soft:#fdf4e0;--wood:#c98a4b;--metal:#9aa4ae;--glint:#ffffff}
    text{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .h{font-size:17px;font-weight:650;fill:var(--ink)}
    .s{font-size:13px;fill:var(--muted)}
    .lab{font-size:12px;font-weight:650;letter-spacing:1.6px;fill:var(--muted)}
    .note{font-size:12.5px;fill:var(--muted);font-style:italic}
    .num{font-size:12px;font-weight:700;fill:var(--page)}
    .pill{font-size:11.5px;font-weight:650}
    .arrow{stroke:var(--faint);stroke-width:2;fill:none}
    .flow{stroke:var(--aqua);stroke-width:2.2;fill:none}
    .hot{stroke:var(--blue);stroke-width:2.2;fill:none}
    .live{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.6}
    .live-strong{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2.6}
    .plain{fill:var(--card);stroke:var(--line);stroke-width:1.6}
    .loop{fill:var(--aqua-soft);stroke:var(--aqua);stroke-width:1.6}
    .gate{fill:var(--violet-soft);stroke:var(--violet);stroke-width:2.6}
    .divider{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 6}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" style="fill:var(--faint)"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" style="fill:var(--blue)"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" style="fill:var(--aqua)"/>
    </marker>
  </defs>

  <!-- LIVE -->
  <text class="lab" x="40" y="34">LIVE · WHILE AGENTS WORK</text>
  <text class="note" x="960" y="34" text-anchor="end">no LLM on this path</text>

  <rect class="plain" x="40" y="66" width="210" height="80" rx="40"/>
  <text class="h" x="145" y="101" text-anchor="middle">AI agent</text>
  <text class="s" x="145" y="122" text-anchor="middle">any MCP client</text>

  <rect class="live-strong" x="395" y="58" width="210" height="96" rx="30"/>
  <text class="h" x="500" y="90" text-anchor="middle">proxy</text>
  <text class="s" x="500" y="111" text-anchor="middle">applies the active overlay</text>
  <text class="s" x="500" y="130" text-anchor="middle">records every call</text>

  <rect class="plain" x="750" y="66" width="210" height="80" rx="40"/>
  <text class="h" x="855" y="101" text-anchor="middle">your MCP server</text>
  <text class="s" x="855" y="122" text-anchor="middle">unchanged</text>

  <path class="arrow" d="M258 106 H387" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="arrow" d="M613 106 H742" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="322" y="96" text-anchor="middle">tool calls</text>
  <text class="s" x="678" y="96" text-anchor="middle">forwarded</text>

  <rect class="live" x="315" y="194" width="190" height="52" rx="26"/>
  <text class="h" x="410" y="217" text-anchor="middle" style="font-size:15px">trajectory store</text>
  <text class="s" x="410" y="235" text-anchor="middle">SQLite · redacted</text>
  <path class="hot" d="M430 156 V186" marker-end="url(#ab)"/>

  <!-- the hot reload, coming back up from the loop -->
  <path class="flow" d="M880 306 V214 Q880 196 862 196 H586 Q568 196 568 178 V162" marker-end="url(#aa)"/>
  <text class="s" x="726" y="186" text-anchor="middle">promoted overlay · hot reload, no restart</text>

  <line class="divider" x1="40" y1="270" x2="960" y2="270"/>

  <!-- OFFLINE LOOP -->
  <text class="lab" x="40" y="298">OFFLINE · THE IMPROVEMENT LOOP</text>
  <path class="flow" d="M315 220 H36 Q20 220 20 236 V341 Q20 357 32 357" marker-end="url(#aa)"/>

  <g>
    <rect class="loop" x="40" y="314" width="160" height="86" rx="28"/>
    <circle cx="66" cy="340" r="11" style="fill:var(--aqua)"/><text class="num" x="66" y="344.5" text-anchor="middle">1</text>
    <text class="h" x="128" y="346" text-anchor="middle">observe</text>
    <text class="s" x="120" y="370" text-anchor="middle">which requests the</text>
    <text class="s" x="120" y="387" text-anchor="middle">agent gets wrong</text>
  </g>
  <g>
    <rect class="loop" x="230" y="314" width="160" height="86" rx="28"/>
    <circle cx="256" cy="340" r="11" style="fill:var(--aqua)"/><text class="num" x="256" y="344.5" text-anchor="middle">2</text>
    <text class="h" x="318" y="346" text-anchor="middle">improve</text>
    <text class="s" x="310" y="370" text-anchor="middle">an LLM rewrites tool</text>
    <text class="s" x="310" y="387" text-anchor="middle">docs, tested on DEV</text>
  </g>
  <g>
    <rect class="gate" x="420" y="314" width="160" height="86" rx="28"/>
    <circle cx="446" cy="340" r="11" style="fill:var(--violet)"/><text class="num" x="446" y="344.5" text-anchor="middle">3</text>
    <text class="h" x="508" y="346" text-anchor="middle">gate</text>
    <text class="s" x="500" y="370" text-anchor="middle">judged on SEALED</text>
    <text class="s" x="500" y="387" text-anchor="middle">tasks it never saw</text>
  </g>
  <g>
    <rect class="loop" x="610" y="314" width="160" height="86" rx="28"/>
    <circle cx="636" cy="340" r="11" style="fill:var(--aqua)"/><text class="num" x="636" y="344.5" text-anchor="middle">4</text>
    <text class="h" x="698" y="346" text-anchor="middle">review</text>
    <text class="s" x="690" y="370" text-anchor="middle">side branch + evidence,</text>
    <text class="s" x="690" y="387" text-anchor="middle">or a notification</text>
  </g>
  <g>
    <rect class="loop" x="800" y="314" width="160" height="86" rx="28"/>
    <circle cx="826" cy="340" r="11" style="fill:var(--aqua)"/><text class="num" x="826" y="344.5" text-anchor="middle">5</text>
    <text class="h" x="888" y="346" text-anchor="middle">promote</text>
    <text class="s" x="880" y="370" text-anchor="middle">a person decides;</text>
    <text class="s" x="880" y="387" text-anchor="middle">rollback any time</text>
  </g>
  <path class="flow" d="M202 357 H222" marker-end="url(#aa)"/>
  <path class="flow" d="M392 357 H412" marker-end="url(#aa)"/>
  <path class="flow" d="M582 357 H602" marker-end="url(#aa)"/>
  <path class="flow" d="M772 357 H792" marker-end="url(#aa)"/>

  <!-- verdicts -->
  <rect x="404" y="414" width="50" height="24" rx="12" style="fill:var(--green-soft);stroke:var(--green);stroke-width:1.4"/>
  <text class="pill" x="429" y="430" text-anchor="middle" style="fill:var(--green)">pass</text>
  <rect x="460" y="414" width="44" height="24" rx="12" style="fill:var(--red-soft);stroke:var(--red);stroke-width:1.4"/>
  <text class="pill" x="482" y="430" text-anchor="middle" style="fill:var(--red)">fail</text>
  <rect x="510" y="414" width="88" height="24" rx="12" style="fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.4"/>
  <text class="pill" x="554" y="430" text-anchor="middle" style="fill:var(--amber)">inconclusive</text>
  <text class="note" x="500" y="462" text-anchor="middle">only a pass can ship · everything else is discarded or sent to a person</text>
</svg>
