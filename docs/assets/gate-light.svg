<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" role="img" aria-labelledby="t d">
  <title id="t">How a change is judged</title>
  <desc id="d">A golden set of labeled requests is split once into DEV and SEALED. The improver learns from DEV and produces a candidate. The gate asks the same agent to pick a tool for every SEALED task under the current tools and under the candidate. A pick is correct only if it is the right tool or an equivalent and its arguments are valid for the tool called. Verdicts: pass needs at least 5 fixed, none broken, p at most 0.05; any broken task fails; otherwise inconclusive.</desc>
  <style>:root{--ink:#1f2328;--muted:#59636e;--faint:#818b98;--line:#d1d9e0;--page:#ffffff;--card:#f6f8fa;--body:#ffffff;--glass:#eef3ff;--blue:#2a78d6;--aqua:#1baf7a;--violet:#6250d6;--orange:#eb6834;--amber:#eda100;--red:#e34948;--green:#008300;--blue-soft:#e8f1fc;--aqua-soft:#e6f6ef;--violet-soft:#efedfc;--orange-soft:#fdeee7;--red-soft:#fdecec;--green-soft:#e6f3e6;--amber-soft:#fdf4e0;--wood:#c98a4b;--metal:#9aa4ae;--glint:#ffffff}
    text{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .h{font-size:16.5px;font-weight:650;fill:var(--ink)}
    .s{font-size:12.8px;fill:var(--muted)}
    .lab{font-size:12px;font-weight:650;letter-spacing:1.6px;fill:var(--muted)}
    .note{font-size:12.5px;fill:var(--muted);font-style:italic}
    .chip{font-size:12.5px;fill:var(--ink)}
    .v{font-size:12.5px;font-weight:700}
    .vs{font-size:12.5px;fill:var(--ink)}
    .plain{fill:var(--card);stroke:var(--line);stroke-width:1.6}
    .dev{fill:var(--aqua-soft);stroke:var(--aqua);stroke-width:1.6}
    .seal{fill:var(--violet-soft);stroke:var(--violet);stroke-width:2.4}
    .flow{stroke:var(--aqua);stroke-width:2.2;fill:none}
    .judge{stroke:var(--violet);stroke-width:2.2;fill:none}
    .divider{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 6}
  </style>
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--aqua)"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--violet)"/></marker>
  </defs>

  <text class="lab" x="230" y="38">LEARN · THE IMPROVER</text>
  <text class="lab" x="230" y="258">JUDGE · THE SELECTION GATE</text>

  <!-- golden set -->
  <rect class="plain" x="30" y="150" width="152" height="112" rx="32"/>
  <text class="h" x="106" y="190" text-anchor="middle">golden set</text>
  <text class="s" x="106" y="212" text-anchor="middle">labeled requests,</text>
  <text class="s" x="106" y="229" text-anchor="middle">split once by hash</text>
  <path class="flow" d="M106 148 V112 Q106 96 122 96 H221" marker-end="url(#aa)"/>
  <path class="judge" d="M106 264 V300 Q106 316 122 316 H221" marker-end="url(#av)"/>

  <!-- row 1: learn -->
  <rect class="dev" x="230" y="60" width="172" height="72" rx="36"/>
  <text class="h" x="316" y="91" text-anchor="middle">DEV split</text>
  <text class="s" x="316" y="111" text-anchor="middle">visible to the improver</text>

  <rect class="dev" x="440" y="54" width="232" height="84" rx="30"/>
  <text class="h" x="556" y="82" text-anchor="middle">improver</text>
  <text class="s" x="556" y="102" text-anchor="middle">rewrites docs from the mistakes,</text>
  <text class="s" x="556" y="119" text-anchor="middle">drops patches that do harm</text>

  <rect class="dev" x="710" y="60" width="170" height="72" rx="36"/>
  <text class="h" x="795" y="91" text-anchor="middle">candidate</text>
  <text class="s" x="795" y="111" text-anchor="middle">the proposed overlay</text>

  <path class="flow" d="M404 96 H432" marker-end="url(#aa)"/>
  <path class="flow" d="M674 96 H702" marker-end="url(#aa)"/>

  <!-- the line only the candidate crosses -->
  <line class="divider" x1="230" y1="196" x2="970" y2="196"/>
  <text class="note" x="232" y="186">the improver never sees SEALED; only its candidate crosses this line</text>
  <path class="judge" d="M795 134 V214 Q795 228 781 228 H624 Q608 228 608 244 V262" marker-end="url(#av)"/>

  <!-- row 2: judge -->
  <rect class="seal" x="230" y="280" width="172" height="72" rx="36"/>
  <text class="h" x="316" y="311" text-anchor="middle">SEALED split</text>
  <text class="s" x="316" y="331" text-anchor="middle">only the gate sees it</text>

  <rect class="plain" x="440" y="270" width="232" height="92" rx="30"/>
  <text class="h" x="556" y="300" text-anchor="middle">same agent, two tool lists</text>
  <text class="s" x="556" y="321" text-anchor="middle">today's tools vs the candidate,</text>
  <text class="s" x="556" y="338" text-anchor="middle">a pick for every sealed task</text>

  <path class="judge" d="M404 316 H432" marker-end="url(#av)"/>
  <path class="judge" d="M674 316 H702" marker-end="url(#av)"/>

  <!-- verdicts -->
  <rect class="plain" x="708" y="238" width="266" height="160" rx="22"/>
  <rect x="722" y="254" width="96" height="26" rx="13" style="fill:var(--green-soft);stroke:var(--green);stroke-width:1.4"/>
  <text class="v" x="770" y="271.5" text-anchor="middle" style="fill:var(--green)">pass</text>
  <text class="vs" x="830" y="264">≥ 5 fixed, 0 broken,</text>
  <text class="vs" x="830" y="281">p ≤ 0.05, docs intact</text>
  <rect x="722" y="304" width="96" height="26" rx="13" style="fill:var(--red-soft);stroke:var(--red);stroke-width:1.4"/>
  <text class="v" x="770" y="321.5" text-anchor="middle" style="fill:var(--red)">fail</text>
  <text class="vs" x="830" y="321.5">any sealed task broken</text>
  <rect x="722" y="354" width="96" height="26" rx="13" style="fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.4"/>
  <text class="v" x="770" y="371.5" text-anchor="middle" style="fill:var(--amber)">inconclusive</text>
  <text class="vs" x="830" y="363">too little evidence:</text>
  <text class="vs" x="830" y="380">a person is told</text>

  <!-- what counts as correct -->
  <text class="lab" x="230" y="400">A PICK IS CORRECT ONLY IF</text>
  <rect class="plain" x="230" y="412" width="214" height="30" rx="15"/>
  <text class="chip" x="337" y="432" text-anchor="middle">✓ right tool, or an equivalent</text>
  <rect class="plain" x="454" y="412" width="250" height="30" rx="15"/>
  <text class="chip" x="579" y="432" text-anchor="middle">✓ arguments fit the tool it calls</text>
  <rect class="plain" x="714" y="412" width="258" height="30" rx="15"/>
  <text class="chip" x="843" y="432" text-anchor="middle">✓ decisive across 8 re-asks if disputed</text>
</svg>
